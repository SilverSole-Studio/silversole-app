name: Flutter Release

# Two tag shapes, one rule: production only ever gets a bundle testers ran.
#
#   v1.9.0-rc.N  build the AAB + APKs, upload to Google Play closed testing
#                (alpha), and publish a GitHub pre-release with the APKs.
#   v1.9.0       no build: promote the newest v1.9.0-rc.N on alpha to
#                production at 100 % (Google review follows), and publish the
#                GitHub release with that rc's APKs.
#
# Manual runs build a bundle for an explicit track; `none` only builds it,
# which is how the very first upload to Play Console is made (the Play API
# cannot upload to an app that has never had a release).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, e.g. 1.9.0
        required: true
      track:
        description: Google Play track ("none" builds the AAB as an artifact only)
        type: choice
        default: none
        options: [none, internal, alpha]

permissions:
  contents: write
  # Workload Identity Federation: the run trades its GitHub OIDC token for a
  # short-lived Google credential, so no Play key is stored anywhere.
  id-token: write

env:
  PACKAGE_NAME: com.dongyutech.silversole
  # Neither is a secret. The provider only accepts this repo's
  # flutter-release.yml on main or a v* tag (terraform-infra:
  # environments/production/silversole), and the service account holds no GCP
  # role: its only power is the Play Console permissions granted to it.
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/350967143148/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT: github-play-release@silversole.iam.gserviceaccount.com

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version_name: ${{ steps.plan.outputs.version_name }}
      track: ${{ steps.plan.outputs.track }}
      release_name: ${{ steps.plan.outputs.release_name }}
    steps:
      - id: plan
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_VERSION_NAME" =~ $semver ]]; then
              echo "::error::version_name must look like 1.9.0, got '$INPUT_VERSION_NAME'"
              exit 1
            fi
            kind=manual
            version_name="$INPUT_VERSION_NAME"
            track="$INPUT_TRACK"
            release_name="v${version_name}-manual.${GITHUB_RUN_NUMBER}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            kind=rc
            version_name="${BASH_REMATCH[1]}"
            track=alpha
            release_name="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            kind=final
            version_name="${BASH_REMATCH[1]}"
            track=production
            release_name="$GITHUB_REF_NAME"
          else
            echo "::error::Tag must be vX.Y.Z-rc.N (testing) or vX.Y.Z (production), got '$GITHUB_REF_NAME'"
            exit 1
          fi
          {
            echo "kind=$kind"
            echo "version_name=$version_name"
            echo "track=$track"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"
          echo "$kind release $release_name -> $track"

  build:
    needs: plan
    if: needs.plan.outputs.kind != 'final'
    runs-on: ubuntu-latest
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      # Every run of this workflow gets a higher number, which is all Play
      # asks of a version code.
      VERSION_CODE: ${{ github.run_number }}
      TRACK: ${{ needs.plan.outputs.track }}
      RELEASE_NAME: ${{ needs.plan.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: an unpinned stable silently moved CI to 3.47, whose Gradle/AGP/
          # Kotlin minimums broke every build. Bump on purpose, with android/.
          flutter-version: 3.47.6
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Analyze & Test
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Create Android secrets
        run: |
          cat > android/local.properties <<'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          EOF

      - name: Build app bundle (signed)
        run: |
          flutter build appbundle --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --dart-define=FRIENDS_BACKEND=supabase
          mkdir -p dist
          mv build/app/outputs/bundle/release/app-release.aab "dist/silversole_${RELEASE_NAME#v}.aab"

      - name: Build APKs (signed, same version code)
        if: env.KIND == 'rc'
        run: |
          out=build/app/outputs/flutter-apk
          flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --dart-define=FRIENDS_BACKEND=supabase --split-per-abi
          # 檔名直接寫給誰用（user 10/24：一次四個看不懂要下載哪個）；編號＝建議順序
          v="${RELEASE_NAME#v}"
          mv "$out/app-arm64-v8a-release.apk"   "dist/silversole_${v}_1-phone-arm64.apk"
          mv "$out/app-armeabi-v7a-release.apk" "dist/silversole_${v}_2-old-phone-armv7.apk"
          mv "$out/app-x86_64-release.apk"      "dist/silversole_${v}_4-emulator-x86_64.apk"
          flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --dart-define=FRIENDS_BACKEND=supabase
          mv "$out/app-release.apk" "dist/silversole_${v}_3-any-phone-universal.apk"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: silversole-${{ env.RELEASE_NAME }}-aab
          path: dist/*.aab

      - name: Authenticate to Google Cloud
        id: auth
        if: env.TRACK != 'none'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Write Google Play release notes
        if: env.TRACK != 'none'
        run: |
          # Strict for tags (the GitHub release needs the section too); manual
          # runs fall back to a generic note.
          extra=""
          [ "$KIND" = manual ] && extra="--allow-missing"
          python3 .github/scripts/play_whatsnew.py CHANGELOG.md "v$VERSION_NAME" distribution/whatsnew $extra

      - name: Upload to Google Play
        if: env.TRACK != 'none'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/*.aab
          tracks: ${{ env.TRACK }}
          status: completed
          # 3 = flexible background update (see InAppUpdatePolicy.kt).
          inAppUpdatePriority: 3
          releaseName: ${{ env.RELEASE_NAME }}
          whatsNewDirectory: distribution/whatsnew

      - name: Create GitHub pre-release
        if: env.KIND == 'rc'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Google Play 封閉測試版（內測），測試通過後推 \`v$VERSION_NAME\` 即上架正式版。"
            echo
            cat .github/release-apk-guide.md
            echo
            awk -v ver="v$VERSION_NAME" '
            BEGIN { found=0 }
            $0 ~ "^##[[:space:]]*" ver "$" { found=1; next }
            $0 ~ "^##[[:space:]]+v" { if (found) exit }
            found { print }
            ' CHANGELOG.md
          } > notes.md
          # arm64 first: the in-app GitHub updater offers the first asset.
          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*_1-phone-arm64.apk dist/*_2-old-phone-armv7.apk \
            dist/*_3-any-phone-universal.apk dist/*_4-emulator-x86_64.apk

      - name: Notify Discord
        if: env.KIND == 'rc'
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            SilverSole 內測版 ${{ env.RELEASE_NAME }} 已上傳 Google Play 封閉測試。
            測試人員可在 Play 商店更新。
          wait: true

  promote:
    needs: plan
    if: needs.plan.outputs.kind == 'final'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Exports GOOGLE_APPLICATION_CREDENTIALS, which play_promote.py picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Play API client
        run: pip install --quiet google-auth requests

      - name: Find the tested release candidate
        id: find
        run: python3 .github/scripts/play_promote.py find "$VERSION_NAME"

      - name: Fetch the candidate's APKs
        env:
          RC_TAG: ${{ steps.find.outputs.rc_tag }}
        run: |
          # Before promoting, so a missing GitHub pre-release stops the run
          # while production is still untouched.
          gh release download "$RC_TAG" -p '*.apk' -D dist
          for f in dist/*.apk; do
            mv "$f" "${f/_${RC_TAG#v}_/_${VERSION_NAME}_}"
          done
          # 10/24 前的 rc 是舊檔名，換成新檔名，下面上傳才對得上
          for f in dist/*.apk; do
            case "$f" in
              *_arm64-v8a-release.apk)   mv "$f" "${f%_arm64-v8a-release.apk}_1-phone-arm64.apk" ;;
              *_armeabi-v7a-release.apk) mv "$f" "${f%_armeabi-v7a-release.apk}_2-old-phone-armv7.apk" ;;
              *_universal-release.apk)   mv "$f" "${f%_universal-release.apk}_3-any-phone-universal.apk" ;;
              *_x86_64-release.apk)      mv "$f" "${f%_x86_64-release.apk}_4-emulator-x86_64.apk" ;;
            esac
          done
          ls dist
          if [ "$(git rev-list -n1 "$RC_TAG")" != "$(git rev-list -n1 "$GITHUB_REF_NAME")" ]; then
            echo "::warning::$GITHUB_REF_NAME is not on the same commit as $RC_TAG. Production ships $RC_TAG's build; later commits are not in it."
          fi

      - name: Promote to production (100 %)
        run: python3 .github/scripts/play_promote.py promote "$VERSION_NAME"

      - name: Create GitHub release
        run: |
          {
            cat .github/release-apk-guide.md
            echo
            awk -v ver="$GITHUB_REF_NAME" '
            BEGIN { found=0 }
            $0 ~ "^##[[:space:]]*" ver "$" { found=1; next }
            $0 ~ "^##[[:space:]]+v" { if (found) exit }
            found { print }
            ' CHANGELOG.md
          } > notes.md
          {
            echo "NOTES<<EOF"
            awk -v ver="$GITHUB_REF_NAME" '
            BEGIN { found=0 }
            $0 ~ "^##[[:space:]]*" ver "$" { found=1; next }
            $0 ~ "^##[[:space:]]+v" { if (found) exit }
            found { print }
            ' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_ENV"
          # arm64 first: the in-app GitHub updater offers the first asset.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*_1-phone-arm64.apk dist/*_2-old-phone-armv7.apk \
            dist/*_3-any-phone-universal.apk dist/*_4-emulator-x86_64.apk

      - name: Notify Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            SilverSole APP 新版本：${{ env.VERSION_NAME }}

            ${{ env.NOTES }}

            已送交 Google Play 審核，審核通過後即可在 Play 商店更新。
          wait: true
